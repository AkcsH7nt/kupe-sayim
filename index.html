<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Küpe Sayım</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="ikon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/tesseract.min.js" defer></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="ust">
    <strong id="sayac">0 hayvan</strong>
    <span id="durum" role="status">Açılıyor…</span>
    <span id="cevrimdisi" class="cevrimdisi">İnternet gerekli</span>
  </header>
  <div id="uyari" class="uyari" role="alert" hidden></div>

  <main>
    <section id="ekran-okut" class="ekran">
      <div id="kamera" class="kamera">
        <video id="video" playsinline muted></video>
        <div id="cerceve" class="cerceve" aria-hidden="true"></div>
        <button id="kamera-ac" class="dugme ikincil kamera-ac" hidden>Kamerayı aç</button>
        <div class="kamera-alt">
          <div id="zoom" class="zoom" role="group" aria-label="Yakınlaştırma">
            <button data-zoom="1" aria-pressed="true">1×</button>
            <button data-zoom="2" aria-pressed="false">2×</button>
            <button data-zoom="3" aria-pressed="false">3×</button>
          </div>
          <button id="fener" class="fener" aria-pressed="false">Fener</button>
        </div>
      </div>

      <div class="alt-dugmeler">
        <button id="elle-yaz" class="dugme ikincil">Elle yaz</button>
        <button id="kaydet" class="dugme ana" disabled>Kaydet</button>
      </div>

      <p id="tani" class="tani" aria-hidden="true"></p>

      <ul id="liste" class="liste" aria-label="Okunan küpeler"></ul>
      <p id="liste-bos" class="bos">Küpeyi kameraya gösterin. Onayladığınız küpeler burada birikir.</p>
    </section>

    <section id="ekran-sayimlar" class="ekran" hidden>
      <ul id="sayimlar" class="sayimlar"></ul>
      <p id="sayimlar-bos" class="bos">Henüz kaydedilmiş sayım yok. Okut ekranında Kaydet'e basınca sayım burada saklanır.</p>
    </section>
  </main>

  <nav class="sekmeler">
    <button id="sekme-okut" class="sekme secili" aria-current="page">Okut</button>
    <button id="sekme-sayimlar" class="sekme">Sayımlar</button>
  </nav>

  <div id="bildirim" class="bildirim" role="status" aria-live="polite"></div>

  <dialog id="tus-paneli" class="panel">
    <p id="tus-baslik" class="panel-baslik">Küpe numarası</p>
    <div class="tus-ekran"><span class="tr">TR</span><span id="tus-deger"></span></div>
    <div class="tus-takimi">
      <button data-tus="1">1</button><button data-tus="2">2</button><button data-tus="3">3</button>
      <button data-tus="4">4</button><button data-tus="5">5</button><button data-tus="6">6</button>
      <button data-tus="7">7</button><button data-tus="8">8</button><button data-tus="9">9</button>
      <button id="tus-temizle">Temizle</button><button data-tus="0">0</button><button id="tus-sil" aria-label="Son rakamı sil">⌫</button>
    </div>
    <div class="panel-dugmeler">
      <button id="tus-iptal" class="dugme ikincil">Vazgeç</button>
      <button id="tus-ekle" class="dugme ana" disabled>Ekle</button>
    </div>
  </dialog>

  <dialog id="onay" class="panel">
    <p id="onay-metin" class="panel-baslik"></p>
    <p id="onay-numara" class="onay-numara" hidden><span class="tr">TR</span><span id="onay-il"></span><span id="onay-sira"></span></p>
    <p id="onay-not" class="onay-not" hidden></p>
    <div class="panel-dugmeler">
      <button id="onay-hayir" class="dugme ikincil">Hayır</button>
      <button id="onay-evet" class="dugme ana">Evet</button>
    </div>
  </dialog>
</body>
</html>
